services:
  habitd:
    image: ghcr.io/seals187/habitd:latest
    build: .
    ports: ["${HABITD_PORT:-8080}:${HABITD_PORT:-8080}"]
    volumes: ["./data:/data"]
    environment:
      - TZ=Europe/Zurich
      - HABITD_PORT=${HABITD_PORT:-8080}
      # Only used on the very first start, see "Erster Start und Admin" in the README.
      - HABITD_ADMIN_USER=${HABITD_ADMIN_USER:-${HABITD_USER:-}}
      - HABITD_ADMIN_PASSWORD=${HABITD_ADMIN_PASSWORD:-}
      - HABITD_PASSWORD=${HABITD_PASSWORD:-} # deprecated
      - HABITD_ALLOW_SIGNUP=${HABITD_ALLOW_SIGNUP:-false}
      - HABITD_INSECURE_COOKIES=${HABITD_INSECURE_COOKIES:-false}
      # Plain HTTP for local use. Set to true behind HTTPS.
      - HABITD_COOKIE_SECURE=${HABITD_COOKIE_SECURE:-false}
      - HABITD_API_TOKEN=${HABITD_API_TOKEN:-}
    restart: unless-stopped
