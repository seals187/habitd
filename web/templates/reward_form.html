{{define "content"}}{{$d := .Data}}<main class="page form-page" x-data="rewardForm" data-config='{{$d.Config}}'>
<header class="form-head"><a href="/rewards">Abbrechen</a><h1>{{.Title}}</h1><button type="submit" form="reward-form">Sichern</button></header>
{{with $d.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form id="reward-form" method="post">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label class="field-label" for="title">Name</label>
<input class="input" id="title" name="title" value="{{$d.Reward.Title}}" placeholder="Kino-Abend" maxlength="80" required>
<p class="field-label">Icon</p>
<div class="reward-icons">{{range $d.Icons}}<label style="--c:{{.Color}}"><input type="radio" name="icon" value="{{.Name}}" {{if eq .Name $d.Reward.Icon}}checked{{end}} aria-label="Icon {{.Name}}"><span>{{icon .Name 22}}</span></label>{{end}}</div>
<p class="field-label">Freischalten mit</p>
<div class="seg seg-2">
<label><input type="radio" name="mode" value="coins" x-model="mode" {{if eq $d.Reward.Mode "coins"}}checked{{end}}><span>Talern</span></label>
<label><input type="radio" name="mode" value="streak" x-model="mode" {{if eq $d.Reward.Mode "streak"}}checked{{end}}><span>Serie</span></label>
</div>
<div class="only-coins card stepper-card slim">
<div class="stepper">
<button type="button" class="step" @click="dec" aria-label="Weniger">{{icon "minus" 20}}</button>
<div class="stepper-value"><span class="gold">{{icon "coin" 26}}</span><input name="price" type="number" min="1" step="1" inputmode="numeric" x-model="price" value="{{$d.Reward.Price}}" aria-label="Preis in Talern"></div>
<button type="button" class="step" @click="inc" aria-label="Mehr">{{icon "plus" 20}}</button>
</div>
</div>
<div class="only-streak card stepper-card">
<label class="field-label" for="habit">Welches Habit?</label>
<select class="input" id="habit" name="habit" x-model="habit">{{range $d.Habits}}<option value="{{.ID}}" {{if eq .ID $d.Reward.HabitID}}selected{{end}}>{{.Name}}</option>{{end}}</select>
<label class="field-label" for="target">Serie in Tagen</label>
<input class="input" id="target" name="target" type="number" min="1" inputmode="numeric" x-model="target" value="{{$d.Reward.StreakTarget}}">
<label class="toggle plain"><span>Bei Rückfall zurücksetzen</span><input type="checkbox" name="reset" {{if $d.Reward.ResetOnRelapse}}checked{{end}}><i></i></label>
</div>
<p class="field-label">Wie oft einlösbar?</p>
<div class="seg seg-3">
<label><input type="radio" name="rhythm" value="once" {{if eq $d.Rhythm "once"}}checked{{end}}><span>Einmal</span></label>
<label><input type="radio" name="rhythm" value="always" {{if eq $d.Rhythm "always"}}checked{{end}}><span>Immer</span></label>
<label><input type="radio" name="rhythm" value="weekly" {{if eq $d.Rhythm "weekly"}}checked{{end}}><span>1× / Woche</span></label>
</div>
<label class="toggle plain today-toggle"><span><b>Auf „Heute“ anzeigen</b><small>wenn genug Taler da sind</small></span><input type="checkbox" name="show_today" {{if $d.Reward.ShowToday}}checked{{end}}><i></i></label>
{{with $d.Used}}<p class="muted reward-used">{{.}}</p>{{end}}
</form>
{{if not $d.New}}<form method="post" action="/rewards/{{$d.Reward.ID}}/delete" hx-confirm="„{{$d.Reward.Title}}“ löschen? Auch ihr Verlauf verschwindet.">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button class="delete-btn" type="submit">{{icon "trash-2" 20}}Belohnung löschen</button>
</form>{{end}}
</main>{{end}}
