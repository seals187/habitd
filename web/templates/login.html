{{define "content"}}<main class="auth">
<div class="auth-mark">{{icon "flame" 34}}</div>
<h1>habitd</h1>
<p class="muted">Willkommen zurück.</p>
<form method="post" action="/login">
<label class="field-label" for="password">Passwort</label>
<input class="input" id="password" type="password" name="password" autocomplete="current-password" required autofocus>
{{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<button class="btn-primary" type="submit">Anmelden</button>
</form>
</main>{{end}}
